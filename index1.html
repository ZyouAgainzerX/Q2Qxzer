<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Info Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #16a34a;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #tokenAddress {
      font-family: monospace;
      word-break: break-all;
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      margin: 20px 0;
    }
    #status {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Token Address</h1>

  <div>
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="loginButton">Log in</button>
  </div>

  <p id="tokenAddress">Loading…</p>
  <button id="copyButton">Copy Address</button>

  <p id="status">Not connected.</p>

    <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = "https://vhtgsqrhaiulljbeyjfx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8RswDzXEeRBq418YPrhfXw_gB6IM0K1";

    const EVENT_NAME = "token-address-updated";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tokenAddress = document.getElementById("tokenAddress");
    const copyButton = document.getElementById("copyButton");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const statusText = document.getElementById("status");

    let userChannel = null;

    async function loadTokenAddress() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/site_settings?id=eq.1&select=token_address`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        }

        const result = await response.json();

        tokenAddress.textContent =
          result.length > 0 && result[0].token_address
            ? result[0].token_address
            : "Not yet.....";

        console.log("Loaded token address:", result);
      } catch (error) {
        console.error("Could not load token address:", error);
        tokenAddress.textContent = "Not yet.....";
      }
    }

    async function connectRealtime() {
      const { data: { user }, error: userError } =
        await supabase.auth.getUser();

      if (userError || !user) {
        console.error("Could not identify user:", userError);
        statusText.textContent = "Could not identify logged-in user.";
        return;
      }

      // This must match the admin page:
      // user:${selectedUserId}:updates
      const channelName = `user:${user.id}:updates`;

      console.log("Connecting to user channel:", channelName);

      if (userChannel) {
        await supabase.removeChannel(userChannel);
      }

      userChannel = supabase.channel(channelName, {
        config: {
          private: true
        }
      });

      userChannel
        .on("broadcast", { event: "*" }, ({ event, payload }) => {
          console.log("ANY broadcast received:", event, payload);
        })
        .on("broadcast", { event: EVENT_NAME }, ({ payload }) => {
          console.log("Token update received:", payload);

          if (payload?.token_address) {
            tokenAddress.textContent = payload.token_address;
          }
        })
        .subscribe((status, err) => {
          console.log("User channel status:", status, err);

          if (status === "SUBSCRIBED") {
            statusText.textContent = "Live updates connected.";
          } else if (status === "CHANNEL_ERROR") {
            statusText.textContent =
              "Channel error. Check login and RLS receive policy.";
          } else if (status === "TIMED_OUT") {
            statusText.textContent = "Connection timed out.";
          } else if (status === "CLOSED") {
            statusText.textContent = "Connection closed.";
          } else {
            statusText.textContent = "Channel status: " + status;
          }
        });
    }

    loginButton.addEventListener("click", async () => {
      statusText.textContent = "Logging in…";

      const { error } = await supabase.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value
      });

      if (error) {
        console.error("Login failed:", error);
        statusText.textContent = "Login failed: " + error.message;
        return;
      }

      statusText.textContent = "Logged in. Connecting…";

      await connectRealtime();
    });

    copyButton.addEventListener("click", async () => {
      const address = tokenAddress.textContent;

      if (!address || address === "Not yet.....") return;

      try {
        await navigator.clipboard.writeText(address);

        const originalText = copyButton.textContent;
        copyButton.textContent = "Copied!";

        setTimeout(() => {
          copyButton.textContent = originalText;
        }, 1500);
      } catch (error) {
        console.error("Could not copy address:", error);
      }
    });

    loadTokenAddress();
  </script>
  <foot>  <h2>  </h2>  </foot>
</body>
</html>
