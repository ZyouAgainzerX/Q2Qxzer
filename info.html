<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to join our star</title>
  <link rel="stylesheet" href="style1.css" />
</head>

<body>
  <video
    id="background-video"
    class="background-video"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
    aria-hidden="true"
  >
    <source src="xzer3.MOV" type="video/quicktime" />
    Your browser does not support HTML5 video.
  </video>

  <div class="page-overlay" aria-hidden="true"></div>

  <header>
    <h1 class="vibrant-link">
      <span class="curved-text">Welcome to join our star</span>
    </h1>
  </header>

  <main class="narrow">

    <p class="vibrant-foot">
      <span class="curved-text">
       <a href="index1.html">
        Any price is part of something bigger, like a star among shattered space rocks. </a>
      </span>
    </p>
  </main>

  <footer class="vibrant-foot">
    <span class="curved-text">Let the process begin today with your funds</span>
  </footer>

  <script>
    const video = document.getElementById("background-video");
    const tokenAddress = document.getElementById("tokenAddress");

    // Browsers generally block autoplay with sound, so the video starts muted.
    video.volume = 0.7;

    // Try to enable sound after the visitor interacts with the page.
    document.addEventListener(
      "pointerdown",
      async () => {
        video.muted = false;

        try {
          await video.play();
        } catch (error) {
          console.warn("Video playback with sound was blocked:", error);
        }
      },
      { once: true }
    );
  </script>
</body>
</html>
